schemaVersion: "2"
kind: mixin
name: pi-browser-tools
displayName: Pi Browser Tools
description: Minimal Bash/CDP browser utility scripts and Pi skill instructions.

permissions:
  network:
    allow:
      - host.docker.internal
      - gateway.docker.internal
      - localhost
      - 127.0.0.1

agentInstructions:
  content: |
    Browser Tools are available in the workspace at `./browser-tools/`.
    For usage, load Pi skill `/skill:browser-tools` or read:
    `./.agents/skills/browser-tools/SKILL.md`.
