schemaVersion: "2"
kind: mixin
name: pi-browser-tools
displayName: Pi Browser Tools
description: Minimal Bash/CDP browser utility scripts and Pi skill instructions.

permissions:
  network:
    allow:
      - host.docker.internal
      - gateway.docker.internal
      - localhost
      - 127.0.0.1

agentInstructions:
  content: |
    Browser Tools are available in the workspace at `./browser-tools/`.

    Prefer Pi's `/skill:browser-tools` when available, or read the skill at:
    `./.agents/skills/browser-tools/SKILL.md`.

    Use the short scripts by path, for example:
    `./browser-tools/status.js`, `./browser-tools/nav.js`,
    `./browser-tools/eval.js`, `./browser-tools/dom.js`,
    `./browser-tools/screenshot.js`, `./browser-tools/pick.js`.

    In Docker Sandbox, use headless sandbox-local Chrome/Chromium when installed,
    or connect to a visible host browser with:
    `BROWSER_TOOLS_CDP_URL=http://host.docker.internal:9222`.
